		<section class="mentions-hero">

				<h1 class="section-title">Don ponctuel, votre contribution en action</h1>
				<p class="section-intro">Un don ponctuel permet de répondre rapidement à un besoin identifié : santé,
					scolarité, matériel ou amélioration du quotidien.</p>
				<div class="mt-4 hero-cta">
					<a href="parrainage.html" class="btn btn-primary btn-lg text-uppercase fw-bold me-2 btn-parraine">

					<a href="dons.html" class="btn btn-secondary btn-lg text-uppercase fw-bold btn-decouvrir">

				</div>
			</div>
		</section>

		<section class="section dons-page">
			<div class="container dons-container d-flex flex-column gap-4">
				<!-- SECTION: Formulaire de don ponctuel -->
				<div class="dons-card">
					<h2 class="section-title">Faire un don maintenant</h2>
					<iframe id="haWidget" allowtransparency="true" scrolling="auto"
						src="https://www.helloasso.com/associations/tinara-association/formulaires/1/widget"
						style="width: 100%; height: 1050px; border: none;"
						onload="window.addEventListener('message', e => {const dataHeight = e.data.height; const haWidgetElement = document.getElementById('haWidget'); haWidgetElement.height = dataHeight + 'px';})"></iframe>
				</div>

				<!-- SECTION: Actions rapides -->
				<div class="dons-card">
					<div class="d-flex flex-wrap gap-3">
						<a class="btn btn-outline-primary" href="dons.html">Retour à la page Dons</a>
						<a class="btn btn-secondary" href="index.html#contact">Nous contacter</a>
					</div>
				</div>
			</div>
		</section>
